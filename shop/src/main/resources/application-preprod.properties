spring.application.name=shop-service-preprod
internal.api.key=${INTERNAL_API_KEY}
invoice.download.base-url=${INVOICE_DOWNLOAD_BASE_URL:}
invoice.download.expiry-hours=${INVOICE_DOWNLOAD_EXPIRY_HOURS:168}

server.port=${PORT:8181}
logging.level.root=INFO

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.main.lazy-initialization=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
auth.cookie.name=${AUTH_COOKIE_NAME:jwt_preprod}

aws.region=eu-north-1
aws.s3.bucket-name=unused-in-preprod
aws.accessKeyId=unused-in-preprod
aws.secretAccessKey=unused-in-preprod
aws.sqs.queue.name=unused-in-preprod
spring.cloud.aws.region.static=eu-north-1
spring.cloud.aws.credentials.access-key=unused-in-preprod
spring.cloud.aws.credentials.secret-key=unused-in-preprod

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m

# Scheduled jobs are disabled in preprod unless explicitly enabled in shop.env.
scheduler.stockReminder.cron=${STOCK_REMINDER_CRON:-}
scheduler.messageRemover.cron=${MESSAGE_REMOVER_CRON:-}
scheduler.paymentReminder.cron=${PAYMENT_REMINDER_CRON:-}
scheduler.subsriptionUpdate.cron=${SUBSCRIPTION_UPDATE_CRON:-}
scheduler.reportGeneration.cron=${REPORT_GENERATION_CRON:-}
scheduler.resetreportsentstatus.cron=${REPORT_STATUS_RESET_CRON:-}

razorpay.key.secret=${RAZOR_PAY_SECRET}
razorpay.key.id=${RAZOR_PAY_ID}
gemini.flash.apikey=${GEMINI_FLASH_KEY}
gemini.flash.url=${GEMINI_FLASH_URL}

management.server.port=${MANAGEMENT_PORT:7183}
management.endpoints.web.exposure.include=health,info,metrics,logfile,loggers,prometheus

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

bucket4j.enabled=true
bucket4j.cache-to-use=jcache
bucket4j.filters[0].cache-name=global-rate-limit
bucket4j.filters[0].url=.*
bucket4j.filters[0].filter-method=servlet
bucket4j.filters[0].rate-limits[0].cache-key=getRemoteAddr()
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=100
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[0].http-status-code=TOO_MANY_REQUESTS
bucket4j.filters[0].http-content-type=application/json
bucket4j.filters[0].http-response-body={"message": "Too many requests. Please try again later.", "success": false}
bucket4j.filters[0].filter-order=100
spring.config.import=classpath:application-ratelimit.properties

upload.profile.dir=${PROFILE_UPLOAD_DIR:/home/ubuntu/clearbills-preprod/uploads/profiles/}
upload.logo.dir=${LOGO_UPLOAD_DIR:/home/ubuntu/clearbills-preprod/uploads/logos/}
upload.sign.dir=${SIGNATURE_UPLOAD_DIR:/home/ubuntu/clearbills-preprod/uploads/signs/}
app.frontend.base-url=${FRONTEND_BASE_URL:https://preprod.clearbills.info}
