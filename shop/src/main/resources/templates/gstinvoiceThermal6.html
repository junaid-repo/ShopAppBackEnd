<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Invoice - ' + ${invoiceId}">Receipt</title>
    <style>
        /* * THE PREMIUM CARD THERMAL CSS
         * Style: Rounded, Soft, High-Contrast Elements
         */
        @page {
            size: 80mm auto;
            margin: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 11px;
            color: #222;
            background: #fff;
            margin: 0;
            padding: 0;
            line-height: 1.4;
        }

        .receipt-wrapper {
            width: 100%;
            max-width: 76mm;
            margin: 0 auto;
            padding: 5mm 2mm;
        }

        /* Utilities */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; letter-spacing: 0.5px; }
        .flex-between { display: flex; justify-content: space-between; align-items: flex-end; }

        /* Header Section */
        .brand-section {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-img {
            max-height: 55px;
            margin-bottom: 8px;
            object-fit: contain;
        }
        .shop-title {
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }
        .shop-sub {
            font-size: 10px;
            color: #555;
            margin-top: 2px;
        }

        /* The "Info Card" - Invoice Details */
        .info-card {
            background-color: #f4f4f4; /* Light gray box */
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 2px;
        }
        .info-label { color: #666; font-weight: 600; text-transform: uppercase; font-size: 9px; }
        .info-val { font-weight: bold; }

        /* Customer Section */
        .customer-area {
            margin: 10px 0 15px 0;
            padding-left: 5px;
            border-left: 3px solid #000; /* Stylish left border */
        }
        .cust-label { font-size: 9px; text-transform: uppercase; color: #888; }
        .cust-name { font-size: 12px; font-weight: bold; }

        /* Items Table */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        .items-table thead {
            background-color: #eee; /* Header strip */
        }
        .items-table th {
            text-align: left;
            font-size: 9px;
            font-weight: 700;
            padding: 4px 2px;
            text-transform: uppercase;
        }
        .items-table td {
            padding: 6px 2px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: top;
        }

        /* Specific Columns */
        .c-item { width: 45%; }
        .c-qty { width: 15%; text-align: center; }
        .c-price { width: 20%; text-align: right; }
        .c-total { width: 20%; text-align: right; font-weight: bold; }

        .sub-desc {
            font-size: 9px;
            color: #777;
            display: block;
            margin-top: 1px;
        }

        /* Totals Section */
        .totals-block {
            padding: 0 5px;
        }
        .t-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            font-size: 11px;
        }
        .t-label { color: #555; }

        /* THE "PILL" TOTAL */
        .grand-total-pill {
            background-color: #000;
            color: #fff;
            border-radius: 20px; /* Fully rounded ends */
            padding: 8px 15px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gt-label { font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .gt-value { font-size: 16px; font-weight: 800; }

        /* Payment & Footer */
        .footer-area {
            text-align: center;
            margin-top: 20px;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }
        .pay-info {
            font-size: 10px;
            margin-bottom: 10px;
            background: #fff;
            border: 1px solid #000;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
        }
        .qr-display {
            width: 60px;
            height: 60px;
            margin: 5px auto;
        }
        .terms-list {
            font-size: 8px;
            color: #666;
            margin-top: 10px;
            text-align: justify;
            padding: 0 5px;
        }

    </style>
</head>

<body>
<div class="receipt-wrapper">

    <div class="brand-section">
        <img th:if="${shopLogoBase64}" th:src="'data:image/png;base64,' + ${shopLogoBase64}" class="logo-img"/>

        <h2 th:if="${shopLogoBase64}" class="shop-title" th:text="${shopName}"></h2>
        <h2 th:unless="${shopLogoBase64}" class="shop-title" th:text="${shopLogoText != null ? shopLogoText : shopName}"></h2>

        <div class="shop-sub">
            <span th:text="${shopAddress}"></span><br>
            <span th:text="${shopPhone}"></span>
            <span th:if="${gstNumber}" th:text="' • GST: ' + ${gstNumber}"></span>
        </div>
    </div>

    <div class="info-card">
        <div class="info-row">
            <span class="info-label">Invoice No</span>
            <span class="info-val" th:text="'#' + ${invoiceId}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Date</span>
            <span class="info-val" th:text="${orderedDate}"></span>
        </div>
        <div class="info-row" th:if="${showDueDate and dueAmount != null}">
            <span class="info-label">Due Date</span>
            <span class="info-val" th:text="${dueDate}"></span>
        </div>
    </div>

    <div class="customer-area" th:if="${customerName != 'Anonymous'}">
        <div class="cust-label">Billed To</div>
        <div class="cust-name" th:text="${customerName}"></div>
        <div style="font-size: 10px;" th:text="${customerPhone}"></div>
        <div style="font-size: 10px;" th:text="${combineAddress} ? ${customerBillingAddress} : ${customerBillingAddress}"></div>
    </div>

    <table class="items-table">
        <thead>
        <tr>
            <th class="c-item">Item</th>
            <th class="c-qty">Qty</th>
            <th class="c-price">Rate</th>
            <th class="c-total">Amt</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="product : ${products}">
            <tr>
                <td class="c-item">
                    <span th:text="${product['productName']}" class="bold"></span>
                    <span class="sub-desc" th:if="${showHsnColumn}" th:text="'HSN: ' + ${product['hsnCode']}"></span>
                    <span class="sub-desc" th:if="${showIndividualDiscountPercentage}"
                          th:text="'Disc: ' + ${#numbers.formatDecimal(product['discountPercentage'], 1, 0)} + '%'"></span>
                </td>
                <td class="c-qty" th:text="${#numbers.formatDecimal(product['quantity'], 1, 0)}"></td>
                <td class="c-price" th:text="${#numbers.formatDecimal(product['rate'], 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="c-total" th:text="${#numbers.formatDecimal(product['totalAmount'], 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>

    <div class="totals-block">
        <div class="t-row">
            <span class="t-label">Subtotal</span>
            <span class="bold" th:text="${#numbers.formatDecimal(taxableAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="t-row" th:if="${showTotalDiscountPercentage and totalDiscountAmount > 0}">
            <span class="t-label">Discount</span>
            <span class="bold" th:text="'- ' + ${#numbers.formatDecimal(totalDiscountAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="t-row" th:each="gst : ${gstSummary}">
            <span class="t-label" th:text="${gst['type']} + ' (' + ${gst['percentage']} + '%)'"></span>
            <span th:text="${#numbers.formatDecimal(gst['amount'], 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="t-row" style="color: red; margin-top: 5px;"
             th:if="${showDueAmount and dueAmount != null and dueAmount > 0}">
            <span class="bold uppercase">Balance Due</span>
            <span class="bold" th:text="'₹ ' + ${#numbers.formatDecimal(dueAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="grand-total-pill">
            <span class="gt-label">Total Payable</span>
            <span class="gt-value" th:text="'₹ ' + ${#numbers.formatDecimal(grandTotal, 1, 'COMMA', 0, 'POINT')}"></span>
        </div>

        <div class="text-right" style="font-size: 9px; margin-top: 3px; color: #666;" th:text="${grandTotalInWords}"></div>
    </div>

    <div class="footer-area">

        <div th:if="${(bankAccountName != null and !#strings.isEmpty(bankAccountName)) or (qrCodeBase64 != null and !#strings.isEmpty(qrCodeBase64))}">

            <div th:if="${qrCodeBase64}">
                <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" class="qr-display"/>
            </div>

            <div class="pay-info" th:if="${upiId != null and !#strings.isEmpty(upiId)}" th:text="'UPI: ' + ${upiId}"></div>

            <div style="font-size: 9px;" th:if="${bankAccountName != null and !#strings.isEmpty(bankAccountName)}">
                <span th:text="${bankName}"></span> | <span th:text="${bankAccountNumber}"></span>
            </div>
        </div>

        <div class="terms-list" th:unless="${removeTerms}">
            <div th:each="term : ${termsAndConditions}" th:text="'• ' + ${term}"></div>
        </div>

        <div style="margin-top: 15px; font-weight: bold; font-size: 10px;">
            Thank you for shopping!
        </div>
    </div>

</div>
</body>
</html>
