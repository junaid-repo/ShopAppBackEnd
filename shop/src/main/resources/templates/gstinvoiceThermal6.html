<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Invoice - ' + ${invoiceId}">Receipt</title>

    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #222;
            background: #fff;
            margin: 0;
            padding: 0;
            line-height: 1.4;
        }

        .receipt-wrapper {
            /* 🟢 Utilizes 96% of the paper width to remove vacant space */
            width: 96%;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            padding: 3mm 0;
        }

        /* Utilities */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; letter-spacing: 0.5px; }
        .flex-between { display: flex; justify-content: space-between; align-items: flex-end; }

        /* Header Section */
        .brand-section {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-img {
            margin-bottom: 8px;
            object-fit: contain;
        }
        .shop-title {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }
        .shop-sub {
            color: #555;
            margin-top: 2px;
        }

        /* The "Info Card" - Invoice Details */
        .info-card {
            background-color: #f4f4f4; /* Light gray box */
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }
        .info-label { color: #666; font-weight: 600; text-transform: uppercase; }
        .info-val { font-weight: bold; }

        /* Customer Section */
        .customer-area {
            margin: 10px 0 15px 0;
            padding-left: 5px;
            border-left: 3px solid #000; /* Stylish left border */
        }
        .cust-label { text-transform: uppercase; color: #888; }
        .cust-name { font-weight: bold; font-size: 1.1em; }

        /* Items Table */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        .items-table thead {
            background-color: #eee; /* Header strip */
        }
        .items-table th {
            text-align: left;
            font-weight: 700;
            padding: 4px 2px;
            text-transform: uppercase;
        }
        .items-table td {
            padding: 6px 2px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: top;
        }

        /* Specific Columns */
        .c-item { width: 45%; }
        .c-qty { width: 15%; text-align: center; }
        .c-price { width: 20%; text-align: right; }
        .c-total { width: 20%; text-align: right; font-weight: bold; }

        .sub-desc {
            color: #777;
            display: block;
            margin-top: 1px;
        }

        /* Totals Section */
        .totals-block {
            padding: 0 5px;
        }
        .t-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        .t-label { color: #555; }

        /* 🟢 UPDATED: THE "PILL" TOTAL (Bordered Box instead of Black BG) */
        .grand-total-pill {
            background-color: transparent;
            color: #000;
            border: 2px solid #000;
            border-radius: 20px; /* Fully rounded ends characteristic of this theme */
            padding: 8px 15px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gt-label { font-weight: bold; text-transform: uppercase; }
        .gt-value { font-weight: 800; }

        /* Payment & Footer */
        .footer-area {
            text-align: center;
            margin-top: 20px;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }
        .pay-info {
            margin-bottom: 10px;
            background: #fff;
            border: 1px solid #000;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
        }
        .qr-display {
            display: block;
            margin: 10px auto;
        }
        .terms-list {
            color: #666;
            margin-top: 10px;
            text-align: justify;
            padding: 0 5px;
        }
    </style>

    <style th:if="${printerType == null or printerType == 'THERMAL_2'}">
        @page { size: 58mm auto; margin: 0; }
        body { font-size: 11px; }
        .logo-img { max-height: 55px; }
        .shop-title { font-size: 16px; }
        .shop-sub, .info-row, .pay-info { font-size: 10px; }
        .info-label, .cust-label, .items-table th, .sub-desc { font-size: 9px; }
        .t-row { font-size: 11px; }
        .gt-label { font-size: 12px; }
        .gt-value { font-size: 16px; }
        .terms-list { font-size: 8px; }
        /* 🟢 Increased QR Size */
        .qr-display { width: 80px; height: 80px; }

        /* Constrain wrapper width for 58mm thermal */
        .receipt-wrapper { max-width: 56mm; width: 56mm; padding: 2mm; }
    </style>

    <style th:if="${printerType == 'THERMAL_3'}">
        @page { size: 80mm auto; margin: 0; }
        body { font-size: 13px; }
        .logo-img { max-height: 70px; }
        .shop-title { font-size: 20px; }
        .shop-sub, .info-row, .pay-info { font-size: 12px; }
        .info-label, .cust-label, .items-table th, .sub-desc { font-size: 11px; }
        .t-row { font-size: 13px; }
        .gt-label { font-size: 14px; }
        .gt-value { font-size: 20px; }
        .terms-list { font-size: 10px; }
        /* 🟢 Increased QR Size */
        .qr-display { width: 120px; height: 120px; }

        /* Constrain wrapper for 80mm thermal */
        .receipt-wrapper { max-width: 78mm; width: 78mm; padding: 3mm; }
    </style>

    <style th:if="${printerType == 'THERMAL_4'}">
        @page { size: 112mm auto; margin: 0; }
        body { font-size: 16px; }
        .logo-img { max-height: 90px; }
        .shop-title { font-size: 26px; }
        .shop-sub, .info-row, .pay-info { font-size: 15px; }
        .info-label, .cust-label, .items-table th, .sub-desc { font-size: 13px; }
        .t-row { font-size: 16px; }
        .gt-label { font-size: 18px; }
        .gt-value { font-size: 26px; }
        .terms-list { font-size: 12px; }
        /* 🟢 Increased QR Size */
        .qr-display { width: 160px; height: 160px; }

        /* Constrain wrapper for 112mm thermal */
        .receipt-wrapper { max-width: 110mm; width: 110mm; padding: 4mm; }
    </style>
</head>

<body>
<div class="receipt-wrapper">

    <div class="brand-section">
        <img th:if="${shopLogoBase64}" th:src="'data:image/png;base64,' + ${shopLogoBase64}" class="logo-img"/>

        <h2 th:if="${shopLogoBase64}" class="shop-title" th:text="${shopName}"></h2>
        <h2 th:unless="${shopLogoBase64}" class="shop-title" th:text="${shopLogoText != null ? shopLogoText : shopName}"></h2>

        <!-- ADDED: Conditional invoice barcode -->
        <div th:if="${invoiceBarcodeBase64 != null and !#strings.isEmpty(invoiceBarcodeBase64)}" style="margin-top:6px; text-align:center;">
            <img th:src="'data:image/png;base64,' + ${invoiceBarcodeBase64}" class="qr-display" style="max-width:220px; height:auto; display:block; margin:6px auto;"/>
        </div>

        <div class="shop-sub">
            <span th:text="${shopAddress}"></span><br>
            <span th:text="${shopPhone}"></span>
            <span th:if="${gstNumber}" th:text="' • GST: ' + ${gstNumber}"></span>
        </div>
    </div>

    <div class="info-card">
        <div class="info-row">
            <span class="info-label">Invoice No</span>
            <span class="info-val" th:text="'#' + ${invoiceId}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Date</span>
            <span class="info-val" th:text="${orderedDate}"></span>
        </div>
        <div class="info-row" th:if="${showDueDate and dueAmount != null}">
            <span class="info-label">Due Date</span>
            <span class="info-val" th:text="${dueDate}"></span>
        </div>
    </div>

    <div class="customer-area" th:if="${customerName != 'Anonymous'}">
        <div class="cust-label">Billed To</div>
        <div class="cust-name" th:text="${customerName}"></div>
        <div style="font-size: 0.9em;" th:text="${customerPhone}"></div>
        <div style="font-size: 0.9em;" th:text="${combineAddress} ? ${customerBillingAddress} : ${customerBillingAddress}"></div>
    </div>

    <table class="items-table">
        <thead>
        <tr>
            <th class="c-item">Item</th>
            <th class="c-qty">Qty</th>
            <th class="c-price">Rate</th>
            <th class="c-total">Amt</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="product : ${products}">
            <tr>
                <td class="c-item">
                    <span th:text="${product['productName']}" class="bold"></span>
                    <span class="sub-desc" th:if="${showHsnColumn}" th:text="'HSN: ' + ${product['hsnCode']}"></span>
                    <span class="sub-desc" th:if="${showIndividualDiscountPercentage}"
                          th:text="'Disc: ' + ${amounts.percentage(product['discountPercentage'])} + '%'">
                    </span>

                    <!-- ADDED: GST breakdown per product -->
                    <div th:if="${showProductGst}"  style="font-size:0.85em; color:#777; margin-top:3px;">
                        <span th:if="${product['igstAmount'] != null and product['igstAmount'] > 0}"
                              th:text="'IGST: ' + ${amounts.grouped(product['igstAmount'])} + ' (' + ${amounts.percentage(product['igstPercentage'])} + '%)'"></span>
                        <span th:if="${product['cgstAmount'] != null and product['cgstAmount'] > 0}"
                              th:text="'CGST: ' + ${amounts.grouped(product['cgstAmount'])} + ' (' + ${amounts.percentage(product['cgstPercentage'])} + '%)'"></span>
                        <span th:if="${product['sgstAmount'] != null and product['sgstAmount'] > 0}"
                              th:text="'SGST: ' + ${amounts.grouped(product['sgstAmount'])} + ' (' + ${amounts.percentage(product['sgstPercentage'])} + '%)'"></span>
                        <span th:if="${product['zeroGst']}"
                              th:text="'GST: ' + ${amounts.grouped(product['taxAmount'])} + ' (' + ${amounts.percentage(product['taxPercentage'])} + '%)'"></span>
                    </div>
                </td>

                <td class="c-qty" th:text="${#numbers.formatDecimal(product['quantity'], 1, 0)}"></td>
                <td class="c-price" th:text="${amounts.grouped(product['rate'])}"></td>
                <td class="c-total" th:text="${amounts.roundedTotal(product['totalAmount'])}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>

    <div class="totals-block">
        <div class="t-row">
            <span class="t-label">Subtotal</span>
            <span class="bold" th:text="${amounts.grouped(taxableAmount)}"></span>
        </div>

        <div class="t-row" th:if="${showTotalDiscountPercentage and totalDiscountAmount > 0}">
            <span class="t-label">Discount</span>
            <span class="bold" th:text="'- ' + ${amounts.grouped(totalDiscountAmount)}"></span>
        </div>

        <div class="t-row" th:each="gst : ${gstSummary}">
            <span class="t-label" th:text="${gst['type']} + ' (' + ${amounts.percentage(gst['percentage'])} + '%)'"></span>
            <span th:text="${amounts.grouped(gst['amount'])}"></span>
        </div>

        <div class="grand-total-pill">
            <span class="gt-label">Total Payable <small>(rounded off)</small></span>
            <span class="gt-value" th:text="'₹ ' + ${amounts.roundedTotal(grandTotal)}"></span>
        </div>

        <div class="text-right" style="font-size: 0.85em; margin-top: 3px; color: #666;" th:text="${grandTotalInWords}"></div>
    </div>

    <div class="footer-area">

        <div th:if="${showBankDetails or showQrCode}">

            <div th:if="${showQrCode and qrCodeBase64 != null and !#strings.isEmpty(qrCodeBase64)}">
                <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" class="qr-display"/>
            </div>

            <div class="pay-info" th:if="${showUpiId and upiId != null and !#strings.isEmpty(upiId)}" th:text="'UPI: ' + ${upiId}"></div>

            <div style="font-size: 0.9em;" th:if="${showBankDetails}">
                <span th:text="${bankName}"></span> | <span th:text="${bankAccountNumber}"></span>
            </div>
        </div>

        <div class="terms-list" th:unless="${removeTerms}">
            <div th:each="term : ${termsAndConditions}" th:text="'• ' + ${term}"></div>
        </div>

        <div style="margin-top: 15px; font-weight: bold; font-size: 0.9em;">
            Thank you for shopping!
        </div>
    </div>

</div>
</body>
</html>
