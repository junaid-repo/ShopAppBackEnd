<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Invoice - ' + ${invoiceId}">Receipt</title>

    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 0;
            line-height: 1.2;
        }

        .receipt-wrapper {
            /* 🟢 Utilizes 96% of the paper width to remove vacant space while keeping a tiny safe margin */
            width: 96%;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            padding: 3mm 0;
        }

        /* Utilities */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; }
        .flex-between { display: flex; justify-content: space-between; align-items: flex-end; }
        .break-word { word-wrap: break-word; word-break: break-all; }

        /* Header Section */
        .brand-section {
            text-align: center;
            margin-bottom: 8px;
            border-bottom: 2px dashed #000;
            padding-bottom: 8px;
        }
        .logo-img {
            margin-bottom: 4px;
            object-fit: contain;
            filter: grayscale(100%);
        }
        .shop-title {
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 2px 0;
            line-height: 1;
        }
        .shop-sub {
            color: #000;
        }

        /* Info Card */
        .info-card {
            margin-bottom: 8px;
            border-bottom: 1px dashed #000;
            padding-bottom: 5px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }
        .info-label { font-weight: 600; }
        .info-val { font-weight: bold; text-align: right;}

        /* Customer Section */
        .customer-area {
            margin: 5px 0 8px 0;
            line-height: 1.2;
        }
        .cust-label { text-transform: uppercase; font-weight: bold; color: #000; }
        .cust-name { font-weight: 800; margin-bottom: 1px;}

        /* Items Table */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 8px;
        }
        .items-table thead {
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
        }
        .items-table th {
            text-align: left;
            font-weight: 800;
            padding: 4px 0;
            text-transform: uppercase;
        }
        .items-table td {
            padding: 5px 0;
            vertical-align: top;
        }

        /* Column Optimization */
        .c-item { width: 45%; padding-right: 2px; }
        .c-qty { width: 10%; text-align: center; }
        .c-price { width: 20%; text-align: right; }
        .c-total { width: 25%; text-align: right; font-weight: bold; }

        .sub-desc {
            color: #444;
            display: block;
            margin-top: 1px;
            font-style: italic;
        }

        /* Totals Section */
        .totals-block {
            border-top: 1px dashed #000;
            padding-top: 5px;
        }
        .t-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        .t-label { color: #000; font-weight: 600; }

        /* 🟢 UPDATED: The "PILL" - Now a clean bordered box */
        .grand-total-pill {
            background-color: transparent;
            color: #000;
            border: 2px solid #000;
            border-radius: 4px; /* Optional slight curve */
            padding: 6px 8px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gt-label { font-weight: bold; text-transform: uppercase; }
        .gt-value { font-weight: 900; }

        /* Footer */
        .footer-area {
            text-align: center;
            margin-top: 10px;
            padding-top: 5px;
            border-top: 1px solid #000;
        }
        .pay-info {
            font-weight: bold;
            margin-bottom: 5px;
            border: 2px solid #000;
            display: inline-block;
            padding: 2px 8px;
        }
        .qr-display {
            display: block;
            margin: 8px auto; /* Ensures it is always centered */
        }
        .terms-list {
            color: #000;
            margin-top: 8px;
            text-align: center;
            line-height: 1.2;
        }
    </style>

    <style th:if="${printerType == null or printerType == 'THERMAL_2'}">
        @page { size: 58mm auto; margin: 0; }
        body { font-size: 12px; }
        .logo-img { max-height: 45px; }
        .shop-title { font-size: 16px; }
        .shop-sub, .pay-info { font-size: 10px; }
        .info-row, .customer-area, .items-table td, .t-row { font-size: 11px; }
        .cust-label, .items-table th, .sub-desc, .terms-list { font-size: 9px; }
        .cust-name, .gt-label { font-size: 12px; }
        .gt-value { font-size: 16px; }
        /* 🟢 Increased QR Size */
        .qr-display { width: 80px; height: 80px; }
    </style>

    <style th:if="${printerType == 'THERMAL_3'}">
        @page { size: 80mm auto; margin: 0; }
        body { font-size: 14px; }
        .logo-img { max-height: 65px; }
        .shop-title { font-size: 22px; }
        .shop-sub, .pay-info { font-size: 12px; }
        .info-row, .customer-area, .items-table td, .t-row { font-size: 13px; }
        .cust-label, .items-table th, .sub-desc, .terms-list { font-size: 11px; }
        .cust-name, .gt-label { font-size: 14px; }
        .gt-value { font-size: 20px; }
        /* 🟢 Increased QR Size */
        .qr-display { width: 120px; height: 120px; }
    </style>

    <style th:if="${printerType == 'THERMAL_4'}">
        @page { size: 112mm auto; margin: 0; }
        body { font-size: 16px; }
        .logo-img { max-height: 85px; }
        .shop-title { font-size: 26px; }
        .shop-sub, .pay-info { font-size: 14px; }
        .info-row, .customer-area, .items-table td, .t-row { font-size: 15px; }
        .cust-label, .items-table th, .sub-desc, .terms-list { font-size: 13px; }
        .cust-name, .gt-label { font-size: 16px; }
        .gt-value { font-size: 26px; }
        /* 🟢 Increased QR Size */
        .qr-display { width: 160px; height: 160px; }
    </style>
</head>

<body>
<div class="receipt-wrapper">

    <div class="brand-section">
        <img th:if="${shopLogoBase64}" th:src="'data:image/png;base64,' + ${shopLogoBase64}" class="logo-img"/>

        <div th:if="${shopLogoBase64}">
            <h2 class="shop-title" th:text="${shopName}"></h2>
        </div>
        <div th:unless="${shopLogoBase64}">
            <h2 class="shop-title" th:text="${shopLogoText != null ? shopLogoText : shopName}"></h2>
        </div>

        <div class="shop-sub">
            <span th:text="${shopAddress}"></span><br>
            <span th:text="${shopPhone}"></span>
            <div th:if="${gstNumber}" style="margin-top:2px; font-weight:bold;" th:text="'GST: ' + ${gstNumber}"></div>
        </div>
    </div>

    <div class="info-card">
        <div class="info-row">
            <span class="info-label">Invoice No:</span>
            <span class="info-val" th:text="'#' + ${invoiceId}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Date:</span>
            <span class="info-val" th:text="${orderedDate}"></span>
        </div>
        <div class="info-row" th:if="${showDueDate and dueAmount != null}">
            <span class="info-label">Due Date:</span>
            <span class="info-val" th:text="${dueDate}"></span>
        </div>
    </div>

    <div class="customer-area" th:if="${customerName != 'Anonymous'}">
        <div class="cust-label">Billed To</div>
        <div class="cust-name" th:text="${customerName}"></div>
        <div th:text="${customerPhone}"></div>
        <div style="font-size: 0.9em;" th:text="${combineAddress} ? ${customerBillingAddress} : ${customerBillingAddress}"></div>
    </div>

    <table class="items-table">
        <thead>
        <tr>
            <th class="c-item">Item</th>
            <th class="c-qty">Qt</th>
            <th class="c-price">Rate</th>
            <th class="c-total">Amt</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="product : ${products}">
            <tr>
                <td class="c-item">
                    <div style="line-height: 1.1; margin-bottom: 2px;">
                        <span th:text="${product['productName']}" class="bold break-word"></span>
                    </div>
                    <span class="sub-desc" th:if="${showHsnColumn}" th:text="'HSN:' + ${product['hsnCode']}"></span>
                    <span class="sub-desc" th:if="${showIndividualDiscountPercentage}"
                          th:text="'Disc: ' + ${#numbers.formatDecimal(product['discountPercentage'], 1, 0)} + '%'"></span>
                </td>
                <td class="c-qty" th:text="${#numbers.formatDecimal(product['quantity'], 1, 0)}"></td>
                <td class="c-price" th:text="${#numbers.formatDecimal(product['rate'], 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="c-total" th:text="${#numbers.formatDecimal(product['totalAmount'], 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>

    <div class="totals-block">
        <div class="t-row">
            <span class="t-label">Subtotal</span>
            <span class="bold" th:text="${#numbers.formatDecimal(taxableAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="t-row" th:if="${showTotalDiscountPercentage and totalDiscountAmount > 0}">
            <span class="t-label">Discount</span>
            <span class="bold" th:text="'-' + ${#numbers.formatDecimal(totalDiscountAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="t-row" th:each="gst : ${gstSummary}">
            <span class="t-label" th:text="${gst['type']} + ' (' + ${gst['percentage']} + '%)'"></span>
            <span th:text="${#numbers.formatDecimal(gst['amount'], 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="t-row" style="margin-top: 6px; border-top: 1px dotted #000; padding-top:2px;"
             th:if="${showDueAmount and dueAmount != null and dueAmount > 0}">
            <span class="bold uppercase">Balance Due</span>
            <span class="bold" th:text="'₹ ' + ${#numbers.formatDecimal(dueAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="grand-total-pill">
            <span class="gt-label">Total</span>
            <span class="gt-value" th:text="'₹' + ${#numbers.formatDecimal(grandTotal, 1, 'COMMA', 0, 'POINT')}"></span>
        </div>

        <div class="text-center" style="font-size: 0.8em; margin-top: 5px; color: #000; font-weight: 500;" th:text="${grandTotalInWords}"></div>
    </div>

    <div class="footer-area">

        <div th:if="${(bankAccountName != null and !#strings.isEmpty(bankAccountName)) or (qrCodeBase64 != null and !#strings.isEmpty(qrCodeBase64))}">
            <div th:if="${qrCodeBase64}">
                <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" class="qr-display"/>
            </div>
            <div class="pay-info" th:if="${upiId != null and !#strings.isEmpty(upiId)}" th:text="'UPI: ' + ${upiId}"></div>
        </div>

        <div class="terms-list" th:unless="${removeTerms}">
            <div th:each="term : ${termsAndConditions}" th:text="'• ' + ${term}"></div>
        </div>

        <div style="margin-top: 12px; font-weight: 900; font-size: 1.1em; text-transform: uppercase;">
            Thank you!
        </div>
    </div>

</div>
</body>
</html>
