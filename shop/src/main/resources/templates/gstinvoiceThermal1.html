<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title th:text="'Invoice - ' + ${invoiceId}">Receipt</title>

    <style>
        /* 🟢 Classic Thermal Font Style - NORMAL WEIGHT */

        body {
            font-family: 'Courier New', Courier, 'Lucida Console', monospace;
            font-weight: normal;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 0;
            line-height: 1.3;
        }

        .receipt-wrapper {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 2mm 2mm;
        }

        /* Utilities */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .uppercase { text-transform: uppercase; }
        .break-word { word-wrap: break-word; word-break: break-all; }

        /* Header Section */
        .brand-section {
            text-align: center;
            margin-bottom: 12px;
            border-bottom: 1px dashed #000;
            padding-bottom: 10px;
        }
        .logo-img {
            margin-bottom: 6px;
            object-fit: contain;
            filter: grayscale(100%);
        }
        .shop-title {
            text-transform: uppercase;
            font-weight: bold;
            margin: 0 0 4px 0;
            line-height: 1.1;
            letter-spacing: 1px;
        }
        .shop-sub {
            color: #000;
            line-height: 1.4;
        }

        /* Info Card */
        .info-card {
            margin-bottom: 12px;
            border-bottom: 1px dashed #000;
            padding-bottom: 10px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 3px;
        }

        /* Customer Section */
        .customer-area {
            margin: 10px 0 14px 0;
            line-height: 1.4;
        }
        .cust-label { text-transform: uppercase; margin-bottom: 2px; text-decoration: underline; font-weight: bold; }
        .cust-name { margin-bottom: 2px; font-weight: bold;}

        /* Items Table */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
        }
        .items-table thead {
            border-top: 1px dashed #000;
            border-bottom: 1px dashed #000;
        }
        .items-table tbody tr {
            border-bottom: 1px dotted #ccc;
        }
        .items-table tbody tr:last-child {
            border-bottom: none;
        }

        /* Pipe Separators */
        .items-table th {
            padding: 6px 2px;
            text-transform: uppercase;
            border-bottom: 1px dashed #000;
        }
        .items-table td {
            padding: 6px 2px;
            vertical-align: top;
        }
        .items-table th:not(:last-child),
        .items-table td:not(:last-child) {
            border-right: 1px dashed #000;
        }

        /* Column Optimization */
        .c-item { width: 44%; text-align: left; padding-right: 4px; }
        .c-qty { width: 14%; text-align: center; }
        .c-price { width: 20%; text-align: right; padding-right: 4px; }
        .c-total { width: 22%; text-align: right; }

        .sub-desc {
            display: block;
            margin-top: 2px;
            font-size: 0.85em;
        }

        /* Totals Section */
        .totals-block {
            border-top: 1px dashed #000;
            padding-top: 10px;
        }
        .t-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .grand-total-row {
            border-top: 1px dashed #000;
            border-bottom: 1px dashed #000;
            padding: 6px 0;
            margin-top: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gt-label { text-transform: uppercase; font-weight: bold; }
        .gt-value { font-weight: bold; }

        /* Footer */
        .footer-area {
            text-align: center;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed #000;
        }
        .pay-info {
            margin-bottom: 8px;
            border: 1px dashed #000;
            display: inline-block;
            padding: 4px 10px;
        }
        .qr-display {
            display: block;
            margin: 10px auto;
        }
        .terms-list {
            margin-top: 12px;
            text-align: left;
            line-height: 1.4;
        }
    </style>

    <style th:if="${printerType == null or printerType == 'THERMAL_2'}">
        @page { size: 58mm auto; margin: 0; }
        body { font-size: 24px; }
        .logo-img { max-height: 60px; }
        .shop-title { font-size: 30px; }
        .shop-sub, .pay-info { font-size: 22px; }
        .info-row, .customer-area, .t-row { font-size: 22px; }

        .items-table td, .items-table th { font-size: 22px; }
        .sub-desc { font-size: 20px; }

        .cust-label, .terms-list { font-size: 20px; }
        .cust-name, .gt-label { font-size: 24px; }
        .gt-value { font-size: 28px; }
        .qr-display { width: 200px; height: 200px; } /* Increased from 125px */
    </style>

    <style th:if="${printerType == 'THERMAL_3'}">
        @page { size: 80mm auto; margin: 0; }
        body { font-size: 28px; }
        .logo-img { max-height: 80px; }
        .shop-title { font-size: 36px; }
        .shop-sub, .pay-info { font-size: 16px; }
        .info-row, .customer-area, .t-row { font-size: 26px; }

        .items-table td, .items-table th { font-size: 26px; }
        .sub-desc { font-size: 13px; }

        .cust-label, .terms-list { font-size: 23px; }
        .cust-name, .gt-label { font-size: 28px; }
        .gt-value { font-size: 32px; }
        .qr-display { width: 300px; height: 300px; } /* Increased from 165px */
    </style>

    <style th:if="${printerType == 'THERMAL_4'}">
        @page { size: 112mm auto; margin: 0; }
        body { font-size: 34px; }
        .logo-img { max-height: 100px; }
        .shop-title { font-size: 44px; }
        .shop-sub, .pay-info { font-size: 30px; }
        .info-row, .customer-area, .t-row { font-size: 30px; }

        .items-table td, .items-table th { font-size: 30px; }
        .sub-desc { font-size: 26px; }

        .cust-label, .terms-list { font-size: 26px; }
        .cust-name, .gt-label { font-size: 34px; }
        .gt-value { font-size: 40px; }
        .qr-display { width: 500px; height: 500px; } /* Increased from 405px */
    </style>
</head>

<body>
<div class="receipt-wrapper">

    <div class="brand-section">
        <img th:if="${shopLogoBase64}" th:src="'data:image/png;base64,' + ${shopLogoBase64}" class="logo-img"/>

        <div th:if="${shopLogoBase64}">
            <h2 class="shop-title" th:text="${shopName}"></h2>
        </div>
        <div th:unless="${shopLogoBase64}">
            <h2 class="shop-title" th:text="${shopLogoText != null ? shopLogoText : shopName}"></h2>
        </div>

        <!-- ADDED: Conditional invoice barcode similar to gstinvoice.html -->
        <div th:if="${invoiceBarcodeBase64 != null and !#strings.isEmpty(invoiceBarcodeBase64)}" style="margin-top:6px; text-align:center;">
            <img th:src="'data:image/png;base64,' + ${invoiceBarcodeBase64}" alt="Invoice Barcode" style="max-width:260px; height:auto; display:block; margin:0 auto;"/>
        </div>

        <div class="shop-sub">
            <span th:text="${shopAddress}"></span><br>
            <span th:text="${shopPhone}"></span>
            <div th:if="${gstNumber}" style="margin-top:4px;" th:text="'GSTIN: ' + ${gstNumber}"></div>
        </div>
    </div>

    <div class="info-card">
        <div class="info-row">
            <span>INV NO:</span>
            <span th:text="'#' + ${invoiceId}"></span>
        </div>
        <div class="info-row">
            <span>DATE:</span>
            <span th:text="${orderedDate}"></span>
        </div>
        <div class="info-row" th:if="${showDueDate and dueAmount != null}">
            <span>DUE DATE:</span>
            <span th:text="${dueDate}"></span>
        </div>
    </div>

    <div class="customer-area" th:if="${customerName != 'Anonymous'}">
        <div class="cust-label">BILLED TO</div>
        <div class="cust-name" th:text="${customerName}"></div>
        <div th:text="${customerPhone}"></div>
        <div style="margin-top: 2px;" th:text="${combineAddress} ? ${customerBillingAddress} : ${customerBillingAddress}"></div>
    </div>

    <table class="items-table">
        <thead>
        <tr>
            <th class="c-item">ITEM</th>
            <th class="c-qty">QTY</th>
            <th class="c-price">RATE</th>
            <th class="c-total">AMT</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="product : ${products}">
            <tr>
                <td class="c-item">
                    <div style="margin-bottom: 2px;">
                        <span th:text="${product['productName']}" class="break-word"></span>
                    </div>
                    <span class="sub-desc" th:if="${showHsnColumn and product['hsnCode'] != null}" th:text="'HSN:' + ${product['hsnCode']}"></span>

                    <span class="sub-desc" th:if="${showIndividualDiscountPercentage and product['discountPercentage'] != null and product['discountPercentage'] > 0}"
                          th:text="'Disc: ' + ${amounts.percentage(product['discountPercentage'])} + '%'">
                    </span>

                    <!-- ADDED: GST breakdown per product (show only when enabled) -->
                    <div th:if="${showProductGst}">
                        <span class="sub-desc" th:if="${product['igstAmount'] != null and product['igstAmount'] > 0}"
                              th:text="'IGST: ' + ${amounts.grouped(product['igstAmount'])} + ' (' + ${amounts.percentage(product['igstPercentage'])} + '%)'"></span>
                        <span class="sub-desc" th:if="${product['cgstAmount'] != null and product['cgstAmount'] > 0}"
                              th:text="'CGST: ' + ${amounts.grouped(product['cgstAmount'])} + ' (' + ${amounts.percentage(product['cgstPercentage'])} + '%)'"></span>
                        <span class="sub-desc" th:if="${product['sgstAmount'] != null and product['sgstAmount'] > 0}"
                              th:text="'SGST: ' + ${amounts.grouped(product['sgstAmount'])} + ' (' + ${amounts.percentage(product['sgstPercentage'])} + '%)'"></span>
                    </div>
                </td>

                <td class="c-qty" th:text="${#numbers.formatDecimal(product['quantity'], 1, 'NONE', 0, 'POINT')}"></td>
                <td class="c-price" th:text="${amounts.grouped(product['rate'])}"></td>
                <td class="c-total" th:text="${amounts.grouped(product['totalAmount'])}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>

    <div class="totals-block">
        <div class="t-row">
            <span>SUBTOTAL</span>
            <span th:text="${amounts.grouped(taxableAmount)}"></span>
        </div>

        <div class="t-row" th:if="${showTotalDiscountPercentage and totalDiscountAmount > 0}">
            <span>DISCOUNT</span>
            <span th:text="'-' + ${amounts.grouped(totalDiscountAmount)}"></span>
        </div>

        <th:block th:if="${gstBreakdown}">
            <div class="t-row" th:each="gst : ${gstSummary}">
                <span th:text="${gst['type']} + ' (' + ${amounts.percentage(gst['percentage'])} + '%)'"></span>
                <span th:text="${amounts.grouped(gst['amount'])}"></span>
            </div>
        </th:block>

        <div class="t-row" style="margin-top: 6px; padding-top: 6px; border-top: 1px dotted #000;"
             th:if="${showDueAmount and dueAmount != null and dueAmount > 0}">
            <span class="uppercase">BALANCE DUE</span>
            <span th:text="'Rs. ' + ${amounts.grouped(dueAmount)}"></span>
        </div>

        <div class="grand-total-row">
            <div class="gt-label">
                TOTAL
                <div th:if="${!enableDecimalPlace}" style="font-size: 0.65em; font-weight: normal; text-transform: lowercase; margin-top: 2px;">(rounded off)</div>
            </div>
            <span class="gt-value" th:text="'Rs. ' + ${amounts.grouped(grandTotal)}"></span>
        </div>

        <div class="text-center" style="font-size: 0.85em; margin-top: 8px;" th:text="${grandTotalInWords}"></div>
    </div>

    <div class="footer-area">

        <div th:if="${showBankDetails or showQrCode}">
            <div th:if="${showQrCode and qrCodeBase64 != null and !#strings.isEmpty(qrCodeBase64)}">
                <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" class="qr-display"/>
            </div>

            <div class="pay-info" th:if="${invoiceId != null and !#strings.isEmpty(invoiceId)}" th:text="'INV #: ' + ${invoiceId}"></div>

            <div style="font-size: 0.9em;" th:if="${showBankDetails}">
                <!-- Bank info shown only when showBankDetails is true -->
                <div th:if="${bankName}" th:text="${bankName}"></div>
                <div th:if="${bankAccountNumber}" th:text="'Ac: ' + ${bankAccountNumber}"></div>
                <div th:if="${bankIfscCode}" th:text="'IFSC: ' + ${bankIfscCode}"></div>
                <div th:if="${showUpiId and upiId != null and !#strings.isEmpty(upiId)}" class="bold" style="margin-top: 4px;" th:text="'UPI: ' + ${upiId}"></div>
            </div>
        </div>

        <div class="terms-list" th:unless="${removeTerms}">
            <div th:each="term : ${termsAndConditions}" th:text="'- ' + ${term}"></div>
        </div>

        <div style="margin-top: 16px; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px;">
            THANK YOU
        </div>
    </div>

</div>
</body>
</html>
