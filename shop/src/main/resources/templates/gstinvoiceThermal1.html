<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title th:text="'Invoice - ' + ${invoiceId}">Receipt</title>

    <style>
        /* 🟢 Authentic Thermal Font Style */
        body {
            font-family: 'Courier New', Courier, 'Lucida Sans Typewriter', 'Lucida Typewriter', monospace;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 0;
            line-height: 1.3;
        }

        .receipt-wrapper {
            width: 96%;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            padding: 2mm 0;
        }

        /* Utilities */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .bold { font-weight: bold; }
        .uppercase { text-transform: uppercase; }
        .break-word { word-wrap: break-word; word-break: break-all; }

        /* Header Section */
        .brand-section {
            text-align: center;
            margin-bottom: 12px;
            border-bottom: 1px dashed #000; /* Thin dashed border */
            padding-bottom: 10px;
        }
        .logo-img {
            margin-bottom: 6px;
            object-fit: contain;
            filter: grayscale(100%);
        }
        .shop-title {
            font-weight: bold;
            text-transform: uppercase;
            margin: 0 0 4px 0;
            line-height: 1.1;
            letter-spacing: 1px;
        }
        .shop-sub {
            color: #000;
            line-height: 1.4;
        }

        /* Info Card */
        .info-card {
            margin-bottom: 12px;
            border-bottom: 1px dashed #000;
            padding-bottom: 10px;
        }
        .info-row {
            display: flex;
            justify-content: space-between; /* Spread evenly for clean thermal look */
            align-items: baseline;
            margin-bottom: 3px;
        }

        /* Customer Section */
        .customer-area {
            margin: 10px 0 14px 0;
            line-height: 1.4;
        }
        .cust-label { text-transform: uppercase; font-weight: bold; margin-bottom: 2px; text-decoration: underline; }
        .cust-name { font-weight: bold; margin-bottom: 2px;}

        /* Items Table */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
        }
        .items-table thead {
            border-top: 1px dashed #000;
            border-bottom: 1px dashed #000;
        }
        .items-table tbody tr {
            border-bottom: 1px dotted #ccc; /* Very light separator for items */
        }
        .items-table tbody tr:last-child {
            border-bottom: none;
        }
        .items-table th {
            text-align: left;
            font-weight: bold;
            padding: 6px 0;
            text-transform: uppercase;
        }
        .items-table td {
            padding: 6px 0;
            vertical-align: top;
        }

        /* Column Optimization */
        .c-item { width: 45%; padding-right: 4px; }
        .c-qty { width: 15%; text-align: center; }
        .c-price { width: 20%; text-align: right; }
        .c-total { width: 20%; text-align: right; font-weight: bold; }

        .sub-desc {
            display: block;
            margin-top: 2px;
            font-size: 0.85em;
        }

        /* Totals Section */
        .totals-block {
            border-top: 1px dashed #000;
            padding-top: 10px;
        }
        .t-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        /* Replaced thick pill with a classic thermal grand-total row */
        .grand-total-row {
            border-top: 1px dashed #000;
            border-bottom: 1px dashed #000;
            padding: 6px 0;
            margin-top: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gt-label { font-weight: bold; text-transform: uppercase; }
        .gt-value { font-weight: bold; }

        /* Footer */
        .footer-area {
            text-align: center;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed #000;
        }
        .pay-info {
            font-weight: bold;
            margin-bottom: 8px;
            border: 1px dashed #000;
            display: inline-block;
            padding: 4px 10px;
        }
        .qr-display {
            display: block;
            margin: 10px auto;
        }
        .terms-list {
            margin-top: 12px;
            text-align: left;
            line-height: 1.4;
        }
    </style>

    <style th:if="${printerType == null or printerType == 'THERMAL_2'}">
        @page { size: 58mm auto; margin: 0; }
        body { font-size: 26px; } /* Increased from 11px */
        .logo-img { max-height: 60px; }
        .shop-title { font-size: 32px; }
        .shop-sub, .pay-info { font-size: 24px; }
        .info-row, .customer-area, .t-row { font-size: 24px; }

        .items-table td, .items-table th { font-size: 24px; }
        .sub-desc { font-size: 22px; }

        .cust-label, .terms-list { font-size: 22px; }
        .cust-name, .gt-label { font-size: 26px; }
        .gt-value { font-size: 30px; }
        .qr-display { width: 120px; height: 120px; }
    </style>

    <style th:if="${printerType == 'THERMAL_3'}">
        @page { size: 80mm auto; margin: 0; }
        body { font-size: 30px; } /* Increased from 13px */
        .logo-img { max-height: 80px; }
        .shop-title { font-size: 38px; }
        .shop-sub, .pay-info { font-size: 18px; }
        .info-row, .customer-area, .t-row { font-size: 28px; }

        .items-table td, .items-table th { font-size: 28px; }
        .sub-desc { font-size: 15px; }

        .cust-label, .terms-list { font-size: 25px; }
        .cust-name, .gt-label { font-size: 30px; }
        .gt-value { font-size: 34px; }
        .qr-display { width: 160px; height: 160px; }
    </style>

    <style th:if="${printerType == 'THERMAL_4'}">
        @page { size: 112mm auto; margin: 0; }
        body { font-size: 36px; } /* Increased from 15px */
        .logo-img { max-height: 100px; }
        .shop-title { font-size: 46px; }
        .shop-sub, .pay-info { font-size: 32px; }
        .info-row, .customer-area, .t-row { font-size: 32px; }

        .items-table td, .items-table th { font-size: 32px; }
        .sub-desc { font-size: 28px; }

        .cust-label, .terms-list { font-size: 28px; }
        .cust-name, .gt-label { font-size: 36px; }
        .gt-value { font-size: 42px; }
        .qr-display { width: 400px; height: 400px; }
    </style>
</head>

<body>
<div class="receipt-wrapper">

    <div class="brand-section">
        <img th:if="${shopLogoBase64}" th:src="'data:image/png;base64,' + ${shopLogoBase64}" class="logo-img"/>

        <div th:if="${shopLogoBase64}">
            <h2 class="shop-title" th:text="${shopName}"></h2>
        </div>
        <div th:unless="${shopLogoBase64}">
            <h2 class="shop-title" th:text="${shopLogoText != null ? shopLogoText : shopName}"></h2>
        </div>

        <div class="shop-sub">
            <span th:text="${shopAddress}"></span><br>
            <span th:text="${shopPhone}"></span>
            <div th:if="${gstNumber}" style="margin-top:4px;" th:text="'GSTIN: ' + ${gstNumber}"></div>
        </div>
    </div>

    <div class="info-card">
        <div class="info-row">
            <span>INV NO:</span>
            <span class="bold" th:text="'#' + ${invoiceId}"></span>
        </div>
        <div class="info-row">
            <span>DATE:</span>
            <span class="bold" th:text="${orderedDate}"></span>
        </div>
        <div class="info-row" th:if="${showDueDate and dueAmount != null}">
            <span>DUE DATE:</span>
            <span class="bold" th:text="${dueDate}"></span>
        </div>
    </div>

    <div class="customer-area" th:if="${customerName != 'Anonymous'}">
        <div class="cust-label">BILLED TO</div>
        <div class="cust-name" th:text="${customerName}"></div>
        <div th:text="${customerPhone}"></div>
        <div style="margin-top: 2px;" th:text="${combineAddress} ? ${customerBillingAddress} : ${customerBillingAddress}"></div>
    </div>

    <table class="items-table">
        <thead>
        <tr>
            <th class="c-item">ITEM</th>
            <th class="c-qty">QTY</th>
            <th class="c-price">RATE</th>
            <th class="c-total">AMT</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="product : ${products}">
            <tr>
                <td class="c-item">
                    <div style="margin-bottom: 2px;">
                        <span th:text="${product['productName']}" class="bold break-word"></span>
                    </div>
                    <span class="sub-desc" th:if="${showHsnColumn and product['hsnCode'] != null}" th:text="'HSN:' + ${product['hsnCode']}"></span>

                    <span class="sub-desc" th:if="${showIndividualDiscountPercentage and product['discountPercentage'] != null and product['discountPercentage'] > 0}"
                          th:text="'Disc: ' + ${#numbers.formatDecimal(product['discountPercentage'], 1, 0)} + '%'"></span>

                    <span class="sub-desc" th:if="${gstBreakdown and product['taxPercentage'] != null and product['taxPercentage'] > 0}"
                          th:text="'GST: ' + ${#numbers.formatDecimal(product['taxPercentage'], 1, 0)} + '%'"></span>
                </td>
                <td class="c-qty" th:text="${#numbers.formatDecimal(product['quantity'], 1, 0)}"></td>
                <td class="c-price" th:text="${#numbers.formatDecimal(product['rate'], 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="c-total" th:text="${#numbers.formatDecimal(product['totalAmount'], 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>

    <div class="totals-block">
        <div class="t-row">
            <span>SUBTOTAL</span>
            <span class="bold" th:text="${#numbers.formatDecimal(taxableAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="t-row" th:if="${showTotalDiscountPercentage and totalDiscountAmount > 0}">
            <span>DISCOUNT</span>
            <span class="bold" th:text="'-' + ${#numbers.formatDecimal(totalDiscountAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <th:block th:if="${gstBreakdown}">
            <div class="t-row" th:each="gst : ${gstSummary}">
                <span th:text="${gst['type']} + ' (' + ${gst['percentage']} + '%)'"></span>
                <span th:text="${#numbers.formatDecimal(gst['amount'], 1, 'COMMA', 2, 'POINT')}"></span>
            </div>
        </th:block>

        <div class="t-row" style="margin-top: 6px; padding-top: 6px; border-top: 1px dotted #000;"
             th:if="${showDueAmount and dueAmount != null and dueAmount > 0}">
            <span class="bold uppercase">BALANCE DUE</span>
            <span class="bold" th:text="'Rs. ' + ${#numbers.formatDecimal(dueAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="grand-total-row">
            <span class="gt-label">TOTAL</span>
            <span class="gt-value" th:text="'Rs. ' + ${#numbers.formatDecimal(grandTotal, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="text-center" style="font-size: 0.85em; margin-top: 8px; font-weight: bold;" th:text="${grandTotalInWords}"></div>
    </div>

    <div class="footer-area">

        <div th:if="${(bankAccountName != null and !#strings.isEmpty(bankAccountName)) or (qrCodeBase64 != null and !#strings.isEmpty(qrCodeBase64))}">
            <div th:if="${qrCodeBase64}">
                <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" class="qr-display"/>
            </div>
            <div class="pay-info" th:if="${invoiceId != null and !#strings.isEmpty(invoiceId)}" th:text="'INV #: ' + ${invoiceId}"></div>
        </div>

        <div class="terms-list" th:unless="${removeTerms}">
            <div th:each="term : ${termsAndConditions}" th:text="'- ' + ${term}"></div>
        </div>

        <div style="margin-top: 16px; font-weight: bold; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px;">
            THANK YOU
        </div>
    </div>

</div>
</body>
</html>
