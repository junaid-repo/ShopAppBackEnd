<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Invoice - ' + ${invoiceId}">Receipt</title>
    <style>
        /* * MINIMALIST BOUTIQUE CSS
         * Style: Airy, Uppercase, Elegant
         */
        @page {
            size: 80mm auto;
            margin: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11px;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 76mm;
            margin: 0 auto;
            padding: 5mm 2mm;
        }

        /* Utilities */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .uppercase { text-transform: uppercase; letter-spacing: 1px; }
        .bold { font-weight: 600; }

        /* The "Fine Line" separator */
        .hairline {
            border-bottom: 1px solid #ccc;
            margin: 10px 0;
            width: 100%;
        }

        /* Header */
        .shop-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .shop-name {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px; /* Distinctive look */
            margin-bottom: 5px;
        }
        .shop-logo {
            max-height: 50px;
            margin-bottom: 10px;
        }
        .shop-meta {
            font-size: 9px;
            color: #444;
        }

        /* Invoice Meta */
        .invoice-meta {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 15px;
        }

        /* Items Table - Clean, No borders */
        table.items {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        table.items th {
            text-align: left;
            font-size: 9px;
            text-transform: uppercase;
            color: #666;
            padding-bottom: 8px;
            font-weight: normal;
            border-bottom: 1px solid #000;
        }
        table.items td {
            padding: 8px 0;
            vertical-align: top;
            border-bottom: 1px solid #eee; /* Very faint separator */
        }

        .col-desc { width: 50%; }
        .col-qty { width: 10%; text-align: center; color: #666; }
        .col-price { width: 20%; text-align: right; }
        .col-amt { width: 20%; text-align: right; font-weight: bold; }

        .item-sub {
            display: block;
            font-size: 9px;
            color: #888;
            font-style: italic;
        }

        /* Totals */
        .totals-wrapper {
            width: 100%;
            font-size: 11px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        /* The "Black Bar" Total */
        .total-bar-black {
            background-color: #000;
            color: #fff;
            padding: 8px 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
        }

        /* Footer Info */
        .footer-info {
            text-align: center;
            font-size: 9px;
            color: #666;
            margin-top: 20px;
        }

        .payment-pill {
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 10px;
            text-align: center;
            margin: 10px auto;
            width: 80%;
        }

    </style>
</head>

<body>
<div class="container">

    <div class="shop-header">
        <img th:if="${shopLogoBase64}" th:src="'data:image/png;base64,' + ${shopLogoBase64}" class="shop-logo"/>
        <div th:unless="${shopLogoBase64}" class="shop-name" th:text="${shopLogoText}"></div>

        <div th:if="${shopLogoBase64}" class="shop-name" th:text="${shopName}"></div>
        <div th:unless="${shopLogoBase64}" class="shop-name" th:text="${shopName}"></div>

        <div class="shop-meta">
            <span th:text="${shopAddress}"></span><br>
            <span th:text="${shopPhone}"></span>
            <span th:if="${gstNumber}" th:text="' | GST: ' + ${gstNumber}"></span>
        </div>
    </div>

    <div class="invoice-meta">
        <div>
            <span class="uppercase" style="color: #888;">Date</span><br>
            <span class="bold" th:text="${orderedDate}"></span>
        </div>
        <div class="text-right">
            <span class="uppercase" style="color: #888;">Invoice</span><br>
            <span class="bold" th:text="'#' + ${invoiceId}"></span>
        </div>
    </div>

    <div th:if="${customerName != 'Anonymous'}" style="margin-bottom: 15px; font-size: 10px;">
        <div class="uppercase" style="color: #888; font-size: 9px; margin-bottom: 2px;">Billed To</div>
        <div class="bold" th:text="${customerName}"></div>
        <div th:text="${customerPhone}"></div>
    </div>

    <table class="items">
        <thead>
        <tr>
            <th class="col-desc">ITEM DESCRIPTION</th>
            <th class="col-qty">QTY</th>
            <th class="col-price">RATE</th>
            <th class="col-amt">AMT</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="product : ${products}">
            <tr>
                <td class="col-desc">
                    <span th:text="${product['productName']}"></span>
                    <span class="item-sub" th:if="${showHsnColumn}" th:text="'HSN: ' + ${product['hsnCode']}"></span>
                    <span class="item-sub" th:if="${showIndividualDiscountPercentage}" th:text="'Disc: ' + ${#numbers.formatDecimal(product['discountPercentage'], 1, 0)} + '%'"></span>
                </td>
                <td class="col-qty" th:text="${#numbers.formatDecimal(product['quantity'], 1, 0)}"></td>
                <td class="col-price" th:text="${#numbers.formatDecimal(product['rate'], 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="col-amt" th:text="${#numbers.formatDecimal(product['totalAmount'], 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>

    <div class="totals-wrapper">
        <div class="total-row">
            <span style="color: #666;">Subtotal</span>
            <span th:text="${#numbers.formatDecimal(taxableAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="total-row" th:if="${showTotalDiscountPercentage and totalDiscountAmount > 0}">
            <span style="color: #666;">Discount</span>
            <span th:text="'- ' + ${#numbers.formatDecimal(totalDiscountAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="total-row" th:each="gst : ${gstSummary}" style="font-size: 10px;">
            <span th:text="${gst['type']} + ' (' + ${gst['percentage']} + '%)'" style="color: #666;"></span>
            <span th:text="${#numbers.formatDecimal(gst['amount'], 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="total-bar-black">
            <span>TOTAL PAYABLE</span>
            <span th:text="'₹ ' + ${#numbers.formatDecimal(grandTotal, 1, 'COMMA', 0, 'POINT')}"></span>
        </div>

        <div class="text-center" style="margin-top: 5px; color: #d00; font-weight: bold;"
             th:if="${showDueAmount and dueAmount != null and dueAmount > 0}">
            Balance Due: <span th:text="'₹ ' + ${#numbers.formatDecimal(dueAmount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>
    </div>

    <div class="footer-info">
        <div class="payment-pill" th:if="${(bankAccountName != null and !#strings.isEmpty(bankAccountName)) or (qrCodeBase64 != null and !#strings.isEmpty(qrCodeBase64))}">

            <div th:if="${upiId != null and !#strings.isEmpty(upiId)}" th:text="'UPI: ' + ${upiId}" class="bold"></div>

            <div th:if="${(upiId == null or #strings.isEmpty(upiId)) and bankName != null}" th:text="'Pay via: ' + ${bankName}"></div>

            <div th:if="${qrCodeBase64}" style="margin-top: 5px;">[ QR Code Available ]</div>
        </div>

        <div th:if="${qrCodeBase64}" style="text-align: center; margin: 10px 0;">
            <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" style="width: 50px; height: 50px;"/>
        </div>

        <div th:unless="${removeTerms}" style="margin-top: 15px; font-size: 8px; color: #888;">
            <div th:each="term : ${termsAndConditions}" th:text="${term}"></div>
        </div>

        <div style="margin-top: 20px; letter-spacing: 1px;" class="uppercase bold">
            Thank You
        </div>
        <div style="margin-top: 2px; font-size: 8px;">For shopping with us</div>
    </div>

</div>
</body>
</html>
