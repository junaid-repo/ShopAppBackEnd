<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Invoice - ' + ${invoiceId}">Receipt</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        .container {
            /* 🟢 Utilizes 96% of the paper width to remove vacant space */
            width: 96%;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            padding: 5mm 0;
        }

        /* Utilities */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .uppercase { text-transform: uppercase; letter-spacing: 1px; }
        .bold { font-weight: 600; }

        /* The "Fine Line" separator */
        .hairline {
            border-bottom: 1px solid #ccc;
            margin: 10px 0;
            width: 100%;
        }

        /* Header */
        .shop-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .shop-name {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .shop-logo {
            margin-bottom: 10px;
            object-fit: contain;
            filter: grayscale(100%);
        }
        .shop-meta {
            color: #444;
        }

        /* Invoice Meta */
        .invoice-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        /* Items Table - Clean, No borders */
        table.items {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        table.items th {
            text-align: left;
            text-transform: uppercase;
            color: #666;
            padding-bottom: 8px;
            font-weight: normal;
            border-bottom: 1px solid #000;
        }
        table.items td {
            padding: 8px 0;
            vertical-align: top;
            border-bottom: 1px solid #eee;
        }

        .col-desc { width: 50%; }
        .col-qty { width: 10%; text-align: center; color: #666; }
        .col-price { width: 20%; text-align: right; }
        .col-amt { width: 20%; text-align: right; font-weight: bold; }

        .item-sub {
            display: block;
            color: #888;
            font-style: italic;
        }

        /* Totals */
        .totals-wrapper {
            width: 100%;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        /* 🟢 UPDATED: The Total Box Styling (Bordered instead of solid black) */
        .total-bar-black {
            background-color: transparent;
            color: #000;
            border: 2px solid #000; /* Clean border instead of solid background */
            padding: 8px 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-radius: 4px;
        }

        /* Footer Info */
        .footer-info {
            text-align: center;
            color: #666;
            margin-top: 20px;
        }

        .payment-pill {
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 5px 10px;
            text-align: center;
            margin: 10px auto;
            width: 80%;
        }

        .qr-img {
            display: block;
            margin: 10px auto;
        }

    </style>

    <style th:if="${printerType == null or printerType == 'THERMAL_2'}">
        @page { size: 58mm auto; margin: 0; }
        body { font-size: 11px; }
        .shop-name { font-size: 14px; }
        .shop-logo { max-height: 45px; }
        .shop-meta, table.items th, .item-sub, .footer-info { font-size: 9px; }
        .invoice-meta, .payment-pill { font-size: 10px; }
        .totals-wrapper { font-size: 11px; }
        .total-bar-black { font-size: 14px; }

        /* 🟢 Increased QR Size */
        .qr-img { width: 80px; height: 80px; }

        /* Constrain overall container width for thermal paper to avoid overly wide layout */
        .container { max-width: 56mm; width: 56mm; padding: 2mm; }
    </style>

    <style th:if="${printerType == 'THERMAL_3'}">
        @page { size: 80mm auto; margin: 0; }
        body { font-size: 13px; }
        .shop-name { font-size: 18px; }
        .shop-logo { max-height: 60px; }
        .shop-meta, table.items th, .item-sub, .footer-info { font-size: 11px; }
        .invoice-meta, .payment-pill { font-size: 12px; }
        .totals-wrapper { font-size: 13px; }
        .total-bar-black { font-size: 18px; }

        /* 🟢 Increased QR Size */
        .qr-img { width: 120px; height: 120px; }

        /* Constrain container for 80mm thermal */
        .container { max-width: 78mm; width: 78mm; padding: 3mm; }
    </style>

    <style th:if="${printerType == 'THERMAL_4'}">
        @page { size: 112mm auto; margin: 0; }
        body { font-size: 16px; }
        .shop-name { font-size: 24px; }
        .shop-logo { max-height: 80px; }
        .shop-meta, table.items th, .item-sub, .footer-info { font-size: 13px; }
        .invoice-meta, .payment-pill { font-size: 15px; }
        .totals-wrapper { font-size: 16px; }
        .total-bar-black { font-size: 24px; }

        /* 🟢 Increased QR Size */
        .qr-img { width: 160px; height: 160px; }

        /* Constrain container for 112mm thermal */
        .container { max-width: 110mm; width: 110mm; padding: 4mm; }
    </style>

</head>

<body>
<div class="container">

    <div class="shop-header">
        <img th:if="${shopLogoBase64}" th:src="'data:image/png;base64,' + ${shopLogoBase64}" class="shop-logo"/>
        <div th:unless="${shopLogoBase64}" class="shop-name" th:text="${shopLogoText}"></div>

        <div th:if="${shopLogoBase64}" class="shop-name" th:text="${shopName}"></div>

        <div class="shop-meta">
            <span th:text="${shopAddress}"></span><br>
            <span th:text="${shopPhone}"></span>
            <span th:if="${gstNumber}" th:text="' | GST: ' + ${gstNumber}"></span>
        </div>

        <!-- ADDED: Conditional invoice barcode -->
        <div th:if="${invoiceBarcodeBase64 != null and !#strings.isEmpty(invoiceBarcodeBase64)}" style="margin-top:6px; text-align:center;">
            <img th:src="'data:image/png;base64,' + ${invoiceBarcodeBase64}" alt="Invoice Barcode" class="qr-img" style="max-width:260px; height:60px; display:block; margin:6px auto;"/>
        </div>

    </div>

    <div class="invoice-meta">
        <div>
            <span class="uppercase" style="color: #888;">Date</span><br>
            <span class="bold" th:text="${orderedDate}"></span>
        </div>
        <div class="text-right">
            <span class="uppercase" style="color: #888;">Invoice</span><br>
            <span class="bold" th:text="'#' + ${invoiceId}"></span>
        </div>
    </div>

    <div th:if="${customerName != 'Anonymous'}" style="margin-bottom: 15px; font-size: 0.9em;">
        <div class="uppercase" style="color: #888; font-size: 0.9em; margin-bottom: 2px;">Billed To</div>
        <div class="bold" th:text="${customerName}"></div>
        <div th:text="${customerPhone}"></div>
    </div>

    <table class="items">
        <thead>
        <tr>
            <th class="col-desc">ITEM DESCRIPTION</th>
            <th class="col-qty">QTY</th>
            <th class="col-price">RATE</th>
            <th class="col-amt">AMT</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="product : ${products}">
            <tr>
                <td class="col-desc">
                    <span th:text="${product['productName']}"></span>
                    <span class="item-sub" th:if="${showHsnColumn}" th:text="'HSN: ' + ${product['hsnCode']}"></span>
                    <span class="item-sub" th:if="${showIndividualDiscountPercentage}" th:text="'Disc: ' + ${amounts.percentage(product['discountPercentage'])} + '%'"></span>

                    <!-- ADDED: GST breakdown per product (show only when enabled) -->
                    <div th:if="${showProductGst}" style="font-size:0.9em; color:#666; margin-top:3px;">
                        <span th:if="${product['igstAmount'] != null and product['igstAmount'] > 0}" th:text="'IGST: ' + ${amounts.grouped(product['igstAmount'])} + ' (' + ${amounts.percentage(product['igstPercentage'])} + '%)'"></span>
                        <span th:if="${product['cgstAmount'] != null and product['cgstAmount'] > 0}" th:text="'CGST: ' + ${amounts.grouped(product['cgstAmount'])} + ' (' + ${amounts.percentage(product['cgstPercentage'])} + '%)'"></span>
                        <span th:if="${product['sgstAmount'] != null and product['sgstAmount'] > 0}" th:text="'SGST: ' + ${amounts.grouped(product['sgstAmount'])} + ' (' + ${amounts.percentage(product['sgstPercentage'])} + '%)'"></span>
                    </div>
                </td>
                <td class="col-qty" th:text="${#numbers.formatDecimal(product['quantity'], 1, 0)}"></td>
                <td class="col-price" th:text="${amounts.grouped(product['rate'])}"></td>
                <td class="col-amt" th:text="${amounts.roundedTotal(product['totalAmount'])}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>

    <div class="totals-wrapper">
        <div class="total-row">
            <span style="color: #666;">Subtotal</span>
            <span th:text="${amounts.grouped(taxableAmount)}"></span>
        </div>

        <div class="total-row" th:if="${showTotalDiscountPercentage and totalDiscountAmount > 0}">
            <span style="color: #666;">Discount</span>
            <span th:text="'- ' + ${amounts.grouped(totalDiscountAmount)}"></span>
        </div>

        <div class="total-row" th:each="gst : ${gstSummary}" style="font-size: 0.9em;">
            <span th:text="${gst['type']} + ' (' + ${amounts.percentage(gst['percentage'])} + '%)'" style="color: #666;"></span>
            <span th:text="${amounts.grouped(gst['amount'])}"></span>
        </div>

        <div class="total-bar-black">
            <span>TOTAL PAYABLE <small>(rounded off)</small></span>
            <span th:text="'₹ ' + ${amounts.roundedTotal(grandTotal)}"></span>
        </div>

        <div class="text-center" style="margin-top: 5px; color: #d00; font-weight: bold;"
             th:if="${showDueAmount and dueAmount != null and dueAmount > 0}">
            Balance Due: <span th:text="'₹ ' + ${amounts.grouped(dueAmount)}"></span>
        </div>
    </div>

    <div class="footer-info">
        <div class="payment-pill" th:if="${showBankDetails or showQrCode}">

            <div th:if="${showUpiId and upiId != null and !#strings.isEmpty(upiId)}" th:text="'UPI: ' + ${upiId}" class="bold"></div>

            <div th:if="${(showUpiId == false) and bankName != null}" th:text="'Pay via: ' + ${bankName}"></div>

            <div th:if="${showQrCode and qrCodeBase64 != null and !#strings.isEmpty(qrCodeBase64)}" style="margin-top: 5px;">[ QR Code Available ]</div>
        </div>

        <div th:if="${showQrCode and qrCodeBase64 != null and !#strings.isEmpty(qrCodeBase64)}">
            <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" class="qr-img"/>
        </div>

        <div th:unless="${removeTerms}" style="margin-top: 15px; font-size: 0.9em;">
            <div th:each="term : ${termsAndConditions}" th:text="${term}"></div>
        </div>

        <div style="margin-top: 20px;" class="uppercase bold">
            Thank You
        </div>
        <div style="margin-top: 2px; font-size: 0.9em;">For shopping with us</div>
    </div>

</div>
</body>
</html>
