spring.application.name=shop-service
internal.api.key=${INTERNAL_API_KEY:local-internal-api-key}
invoice.download.base-url=${INVOICE_DOWNLOAD_BASE_URL:}
invoice.download.expiry-hours=${INVOICE_DOWNLOAD_EXPIRY_HOURS:168}
app.frontend.base-url=${FRONTEND_BASE_URL:https://instabill.in}
#server.port=6062
server.port=${PORT:8081}
logging.level.root=INFO
# ===============================
# = DataSource Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ===============================
# = JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.main.lazy-initialization=true
# The SQL dialect makes Hibernate generate better SQL for the chosen DB
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Optional: Show SQL statements in logs
spring.jpa.show-sql=true
jwt.secret= ${JWT_SECRET}
jwt.expiration-ms=3600000 

aws.region=${EU_REGION}
aws.s3.bucket-name=${S3_BUCKET_NAME}
aws.accessKeyId=${AWS_ACCESS_ID}
aws.secretAccessKey=${AWS_ACCESS_KEY}
aws.sqs.queue.name=${AWS_QUEUE_NAME}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m

scheduler.stockReminder.cron= 0 0 3 * * ?
scheduler.messageRemover.cron= 0 0 0 * * ?
scheduler.paymentReminder.cron= 0 0 3 * * ?
scheduler.subsriptionUpdate.cron= 0 0 0 * * *
scheduler.reportGeneration.cron= 0 */5 1-5 * * ?
scheduler.resetreportsentstatus.cron= 0 0 6 * * ?

razorpay.key.secret=${RAZOR_PAY_SECRET}
razorpay.key.id=${RAZOR_PAY_ID}

# Change to your region (e.g., us-east-1)
spring.cloud.aws.region.static=eu-north-1

# ONLY for local testing. In prod, Beanstalk/IAM handles this automatically!
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_ID}
spring.cloud.aws.credentials.secret-key=${AWS_ACCESS_KEY}

gemini.flash.apikey=${GEMINI_FLASH_KEY}
gemini.flash.url=${GEMINI_FLASH_URL}

spring.task.scheduling.thread-name-prefix=notification-scheduler-

management.server.port=7083
management.endpoints.web.exposure.include=health,info,metrics,logfile,loggers,prometheus

# Connect to your Docker Redis
spring.data.redis.host=localhost
spring.data.redis.port=6378

# --- CACHE CONFIGURATION ---
bucket4j.enabled=true
bucket4j.cache-to-use=jcache

# --- RATE LIMIT RULES ---
# Rule 1: Global API Limit (10 requests per minute per IP)
bucket4j.filters[0].cache-name=global-rate-limit
bucket4j.filters[0].url=.*
bucket4j.filters[0].filter-method=servlet

# 1. THE IP KEY (Updated for v0.12.x)
bucket4j.filters[0].rate-limits[0].cache-key=getRemoteAddr()

# 2. THE LIMITS
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=100
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes

# 3. PROPER HTTP RESPONSE
bucket4j.filters[0].http-status-code=TOO_MANY_REQUESTS
bucket4j.filters[0].http-content-type=application/json
bucket4j.filters[0].http-response-body={"message": "Too many requests. Please try again later.", "success": false}

# 4. FILTER ORDER
bucket4j.filters[0].filter-order=100

spring.config.import=classpath:application-ratelimit.properties

upload.profile.dir=/home/ubuntu/clearbills/uploads/profiles/
upload.logo.dir=/home/ubuntu/clearbills/uploads/logos/
upload.sign.dir=/home/ubuntu/clearbills/uploads/signs/
