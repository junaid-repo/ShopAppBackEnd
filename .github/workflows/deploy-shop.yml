name: Deploy Shop API

on:
  push:
    branches: [ "render-deployment" ]
    # Only run if files in the shop folder change!
    paths:
      - 'shop/**'
  workflow_dispatch: #

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Shop API
        working-directory: ./shop
        run: mvn clean package -DskipTests

      - name: Copy JAR to Oracle Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "shop/target/shop-api.jar"
          target: "/home/ubuntu/clearbills"
          strip_components: 2

      - name: Restart Shop Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo systemctl restart shop-api
