name: Deploy Shop API

on:
  push:
    branches:
      - master
      - preprod
    paths:
      - 'shop/**'
      - '.github/workflows/deploy-shop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-api-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'master' || github.ref_name == 'preprod'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'preprod' }}
    env:
      DEPLOY_DIR: ${{ github.ref_name == 'master' && '/home/ubuntu/clearbills' || '/home/ubuntu/clearbills-preprod' }}
      SERVICE_NAME: ${{ github.ref_name == 'master' && 'shop-api' || 'shop-api-preprod' }}
      HEALTH_URL: ${{ github.ref_name == 'master' && 'http://127.0.0.1:7083/actuator/health' || 'http://127.0.0.1:7183/actuator/health' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Shop API
        working-directory: ./shop
        run: mvn -B clean package -DskipTests

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -eu
            sudo install -d -o "$(id -un)" -g "$(id -gn)" "${{ env.DEPLOY_DIR }}"

      - name: Copy JAR to Oracle Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "shop/target/shop-api.jar"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 2

      - name: Restart and verify Shop Service
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -eu
            sudo systemctl restart "${{ env.SERVICE_NAME }}"

            attempt=1
            while [ "$attempt" -le 18 ]; do
              if curl --fail --silent --show-error "${{ env.HEALTH_URL }}" | grep -q '"status":"UP"'; then
                echo "${{ env.SERVICE_NAME }} is healthy"
                exit 0
              fi
              sleep 5
              attempt=$((attempt + 1))
            done

            sudo systemctl status "${{ env.SERVICE_NAME }}" --no-pager || true
            sudo journalctl -u "${{ env.SERVICE_NAME }}" -n 100 --no-pager || true
            exit 1
