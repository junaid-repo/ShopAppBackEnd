name: Deploy User API

on:
  push:
    branches: [  "**" ]
    # THIS IS THE MAGIC: Only run if files in the user folder change!
    paths:
      - 'gobalusers/**'
  workflow_dispatch: #

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build User API
        working-directory: ./gobalusers
        run: mvn clean package -DskipTests

      - name: Copy JAR to Oracle Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          # Because of your brilliant <finalName> tag, we know exactly what this is called
          source: "gobalusers/target/user-api.jar"
          target: "/home/ubuntu/clearbills"
          strip_components: 2

      - name: Restart User Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo systemctl restart user-api
