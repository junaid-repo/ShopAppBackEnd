spring.application.name=user-service
shop.service.url=${SHOP_SERVICE_URL:http://localhost:8081}
internal.api.key=${INTERNAL_API_KEY:local-internal-api-key}
registration.subscription.plan-type=${REGISTRATION_SUBSCRIPTION_PLAN_TYPE:MONTHLY}
registration.subscription.amount=${REGISTRATION_SUBSCRIPTION_AMOUNT:0}
registration.subscription.type=COMPLEMENTARY
#server.port=9092
server.port=${PORT:8080}
logging.level.root=INFO
# ===============================
# = DataSource Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# = JPA / Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Optional: Show SQL statements in logs
spring.jpa.show-sql=true
jwt.secret= ${JWT_SECRET}
jwt.expiration-ms=36000000 

aws.region=eu-north-1
aws.s3.bucket-name=clearbillsfiles
aws.accessKeyId=${AWS_ACCESS_ID}
aws.secretAccessKey=${AWS_ACCESS_KEY}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

google.client.id=${GOOGLE_CLIENT_ID}


smsalert.apiKey=${SMS_ALERT_APIKEY}
smsalert.baseUrl=${SMS_ALERT_BASEURL}
smsalert.senderId=${SMS_ALERT_SENDERID}

management.server.port=7082
management.endpoints.web.exposure.include=health,info,metrics,logfile,loggers,prometheus

# Connect to your Docker Redis
spring.data.redis.host=localhost
spring.data.redis.port=6378

spring.config.import=classpath:application-ratelimit.properties
