# --- CACHE CONFIGURATION ---
bucket4j.enabled=true
bucket4j.cache-to-use=jcache

# --- Rule 1: Global API Limit ---
bucket4j.filters[0].cache-name=global-rate-limit
bucket4j.filters[0].url=.*
bucket4j.filters[0].filter-method=servlet
bucket4j.filters[0].rate-limits[0].cache-key=getHeader('X-Forwarded-For') != null ? getHeader('X-Forwarded-For') : getRemoteAddr()
bucket4j.filters[0].rate-limits[0].execute-condition=getMethod() != 'OPTIONS'
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=500
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[0].http-status-code=TOO_MANY_REQUESTS
bucket4j.filters[0].http-content-type=application/json
bucket4j.filters[0].http-response-body={"message": "Too many requests. Please try again later.", "success": false}
bucket4j.filters[0].filter-order=100

# --- Rule 2: Authenticated User Limit ---
bucket4j.filters[1].cache-name=authenticated-user-limit
bucket4j.filters[1].url=^/auth/.*
bucket4j.filters[1].filter-method=servlet
bucket4j.filters[1].rate-limits[0].cache-key=T(org.springframework.security.core.context.SecurityContextHolder).getContext().getAuthentication()?.getName() ?: getRemoteAddr()
bucket4j.filters[1].rate-limits[0].execute-condition=getMethod() != 'OPTIONS'
bucket4j.filters[1].rate-limits[0].bandwidths[0].capacity=150
bucket4j.filters[1].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[1].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[1].http-status-code=TOO_MANY_REQUESTS
bucket4j.filters[1].http-content-type=application/json
bucket4j.filters[1].http-response-body={"message": "Account rate limit exceeded.", "success": false}
bucket4j.filters[1].filter-order=10