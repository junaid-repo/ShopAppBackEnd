spring.application.name=user-service-preprod
shop.service.url=${SHOP_SERVICE_URL:http://localhost:8181}
internal.api.key=${INTERNAL_API_KEY}
registration.subscription.plan-type=${REGISTRATION_SUBSCRIPTION_PLAN_TYPE:MONTHLY}
registration.subscription.amount=${REGISTRATION_SUBSCRIPTION_AMOUNT:0}
registration.subscription.type=${REGISTRATION_SUBSCRIPTION_TYPE:COMPLEMENTARY}

server.port=${PORT:8180}
logging.level.root=INFO

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=36000000
auth.cookie.name=${AUTH_COOKIE_NAME:jwt_preprod}

aws.region=eu-north-1
aws.s3.bucket-name=unused-in-preprod
aws.accessKeyId=unused-in-preprod
aws.secretAccessKey=unused-in-preprod

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

google.client.id=${GOOGLE_CLIENT_ID}
smsalert.apiKey=${SMS_ALERT_APIKEY}
smsalert.baseUrl=${SMS_ALERT_BASEURL}
smsalert.senderId=${SMS_ALERT_SENDERID}

management.server.port=${MANAGEMENT_PORT:7182}
management.endpoints.web.exposure.include=health,info,metrics,logfile,loggers,prometheus

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.config.import=classpath:application-ratelimit.properties
app.frontend.base-url=${FRONTEND_BASE_URL:https://preprod.clearbills.info}
